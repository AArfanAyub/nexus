<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Defence in depth: the main process also injects this policy as a response
      header (src/main/security.ts). The meta copy matters for the packaged
      build, where the document is loaded from file:// and may not pass through
      webRequest. T03 tightens this for production builds.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 http://localhost:5173; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>NEXUS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
